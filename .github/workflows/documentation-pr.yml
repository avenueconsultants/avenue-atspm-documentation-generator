name: Shared documentation PR

on:
  workflow_call:
    inputs:
      source-branch:
        description: Consumer branch to document. Push runs use that event's exact commit.
        required: true
        type: string
      target-branch:
        description: Explicit consumer branch that receives the documentation PR.
        required: true
        type: string
      config-file:
        type: string
        default: documentation.json
      output-directory:
        type: string
        default: docs/autogenerated
      sync-container:
        description: Optional explicit destination for additive map discovery. Empty checks without rewriting.
        type: string
        default: ''
      create-pr:
        description: Open a reviewable documentation PR when generated files change.
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

# Separate from any caller concurrency group. Serialize updates to the same output.
concurrency:
  group: shared-docs-${{ github.repository }}-${{ inputs.target-branch }}-${{ inputs.output-directory }}
  cancel-in-progress: false

jobs:
  documentation:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate workflow inputs
        env:
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          git check-ref-format "refs/heads/$TARGET_BRANCH"
          [[ "$SOURCE_BRANCH" != automation/documentation-* && "$TARGET_BRANCH" != automation/documentation-* ]]
          if [[ "$EVENT_NAME" == push && "$EVENT_REF" != "refs/heads/$SOURCE_BRANCH" ]]; then
            echo 'Push branch does not match source-branch.'; exit 1
          fi

      - name: Check out the exact generator workflow revision
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _generator
          persist-credentials: false

      - name: Check out source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source-branch }}
          path: _source
          persist-credentials: false

      - name: Check out PR target
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target-branch }}
          path: _target
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: _generator/requirements.txt
      - name: Install and build shared tooling
        run: |
          dotnet build _generator/src/GenerateDocuments/GenerateDocuments.csproj --configuration Release
          python -m pip install --requirement _generator/requirements.txt

      - name: Discover, generate and validate in staging
        id: prepare
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}
          CONFIG_FILE: ${{ inputs.config-file }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
          SYNC_CONTAINER: ${{ inputs.sync-container }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python _generator/scripts/prepare_documentation_pr.py \
            --source _source --target _target --target-branch "$TARGET_BRANCH" \
            --config "$CONFIG_FILE" --output "$OUTPUT_DIRECTORY" \
            --sync-container "$SYNC_CONTAINER" --repository-url "$REPOSITORY_URL" \
            --artifacts "$RUNNER_TEMP/documentation-preview"

      - name: Upload validated preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: ${{ runner.temp }}/documentation-preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Reject superseded source or target revisions
        if: inputs.create-pr && steps.prepare.outputs.changed == 'true'
        env:
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -euo pipefail
          source_head=$(git -C _target ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" | cut -f1)
          target_head=$(git -C _target ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          if [[ "$source_head" != "$(git -C _source rev-parse HEAD)" || "$target_head" != "$(git -C _target rev-parse HEAD)" ]]; then
            echo 'A branch advanced during generation. Run again on the latest source and target.'
            exit 1
          fi

      - name: Create or update the documentation review PR
        if: inputs.create-pr && steps.prepare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          path: _target
          base: ${{ inputs.target-branch }}
          branch: ${{ steps.prepare.outputs.branch }}
          # A ready-for-review PR requests CODEOWNERS reviews from the cloud team.
          draft: false
          delete-branch: false
          add-paths: |
            ${{ inputs.output-directory }}
            ${{ inputs.config-file }}
          title: Review configuration and documentation updates
          commit-message: Update generated documentation
          body-path: ${{ runner.temp }}/documentation-preview/pr-body.md
