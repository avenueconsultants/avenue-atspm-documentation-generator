name: Publish reviewed documentation site

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths:
      - 'docs/autogenerated/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    # Change @feature/generic-documentation-test to @<full-commit-sha> to pin a generator version.
    uses: avenueconsultants/avenue-atspm-documentation-generator/.github/workflows/documentation-pages.yml@feature/generic-documentation-test
    with:
      docs-branch: documentation-integration
      # Runs only for committed, reviewed generated files on this branch.
      publish: true
      # Defaults: root documentation.json and docs/autogenerated.
