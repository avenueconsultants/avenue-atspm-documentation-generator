name: Update generated documentation

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Change @feature/generic-documentation-test to @<full-commit-sha> to pin a generator version.
    uses: avenueconsultants/avenue-atspm-documentation-generator/.github/workflows/documentation-pr.yml@feature/generic-documentation-test
    with:
      source-branch: documentation-integration
      target-branch: documentation-integration
      create-pr: true
      # Defaults: root documentation.json and docs/autogenerated.
      # For an explicit map, optionally assign new sections to ONE chosen page:
      # sync-container: configuration
