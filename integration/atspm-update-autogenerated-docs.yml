name: Update autogenerated documentation

on:
  workflow_dispatch:
  push:
    branches: [Code-Documentations]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Change @feature/generic-documentation-test to @<full-commit-sha> to pin a generator version.
    uses: avenueconsultants/avenue-atspm-documentation-generator/.github/workflows/documentation-pr.yml@feature/generic-documentation-test
    with:
      source-branch: Code-Documentations
      target-branch: Code-Documentations
      create-pr: true
      # Preserve service-specific assignments; do not guess where new shared
      # ATSPM configuration sections belong.
