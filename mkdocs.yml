site_name: Documentation
site_url: ""
repo_url: !ENV [DOCS_REPOSITORY_URL, ""]
# The default is correct when this project is checked out alongside the ATSPM repo.
# Standalone workflows override DOCS_DIR after this project is transferred.
docs_dir: !ENV [DOCS_DIR, ../docs/autogenerated]
site_dir: site/build
strict: true

theme:
  name: mkdocs
  custom_dir: overrides
  nav_style: dark

# Navigation, title and export branding come from DOCS_CONFIG (bundled map by default).
hooks:
  - scripts/site_configuration.py

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
