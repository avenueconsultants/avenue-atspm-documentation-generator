name: Validate documentation generator

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out generator
        uses: actions/checkout@v7

      - name: Check out ATSPM fixture source
        uses: actions/checkout@v7
        with:
          repository: avenueconsultants/udot-atspm-development
          ref: 9b486193ab586060f741c04087b2383c62d5e56c
          path: _source

      - name: Resolve fixture source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C _source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Test generator
        run: dotnet test GenerateDocuments.sln --configuration Release

      - name: Exercise repository action
        uses: ./
        with:
          source-root: _source
          output-root: _generated
          repository-url: https://github.com/avenueconsultants/udot-atspm-development
          repository-ref: ${{ steps.source.outputs.sha }}

      - name: Verify expected output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t expected < <(
            jq -r '.containers[].slug + ".md"' config/container-config-map.json
            printf '%s\n' index.md log-messages.md
          )

          for file in "${expected[@]}"; do
            test -s "_generated/$file"
          done

          test "$(find _generated -maxdepth 1 -type f -name '*.md' | wc -l)" -eq "${#expected[@]}"
          test -s "_generated/.atspm-docs-generator.json"

      - name: Verify repository configuration consistency
        run: python scripts/validate_repository.py
