name: Generate documentation
description: Generate and validate C# configuration and log-message documentation.

inputs:
  source-root:
    description: Path to the checked-out source repository.
    required: false
    default: .
  output-root:
    description: Path where generated Markdown files will be written.
    required: false
    default: docs/autogenerated
  config-file:
    description: Configuration JSON path, relative to source-root or absolute. Empty explicitly selects the bundled ATSPM map.
    required: false
    default: documentation.json
  repository-url:
    description: Source repository URL used by generated source links.
    required: true
  repository-ref:
    description: Source commit SHA used by generated source links.
    required: true
  validate-site:
    description: Build the generated MkDocs site with strict validation.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve documentation paths
      id: paths
      shell: bash
      env:
        INPUT_SOURCE_ROOT: ${{ inputs.source-root }}
        INPUT_OUTPUT_ROOT: ${{ inputs.output-root }}
        INPUT_REPOSITORY_REF: ${{ inputs.repository-ref }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail

        resolve_path() {
          local candidate="$1"
          if [[ "$candidate" = /* ]]; then
            realpath -m "$candidate"
          else
            realpath -m "${GITHUB_WORKSPACE}/${candidate}"
          fi
        }

        workspace_root="$(realpath -m "$GITHUB_WORKSPACE")"
        source_root="$(resolve_path "$INPUT_SOURCE_ROOT")"
        output_root="$(resolve_path "$INPUT_OUTPUT_ROOT")"
        config_file="$(bash "$ACTION_ROOT/scripts/resolve-config-path.sh" "$source_root" "$ACTION_ROOT" "$INPUT_CONFIG_FILE")"

        if [[ "$output_root" == "$workspace_root" || "$output_root" != "$workspace_root"/* ]]; then
          echo "output-root must be a child of GITHUB_WORKSPACE: $output_root" >&2
          exit 2
        fi

        generated_at="$(git -C "$source_root" show -s --format=%cI "$INPUT_REPOSITORY_REF")"
        test -n "$generated_at"

        echo "workspace-root=$workspace_root" >> "$GITHUB_OUTPUT"
        echo "source-root=$source_root" >> "$GITHUB_OUTPUT"
        echo "output-root=$output_root" >> "$GITHUB_OUTPUT"
        echo "config-file=$config_file" >> "$GITHUB_OUTPUT"
        echo "generated-at=$generated_at" >> "$GITHUB_OUTPUT"

    - name: Build documentation generator
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        dotnet restore "$ACTION_ROOT/src/GenerateDocuments/GenerateDocuments.csproj"
        dotnet build \
          "$ACTION_ROOT/src/GenerateDocuments/GenerateDocuments.csproj" \
          --configuration Release \
          --no-restore

    - name: Generate Markdown documentation
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        SOURCE_ROOT: ${{ steps.paths.outputs.source-root }}
        OUTPUT_ROOT: ${{ steps.paths.outputs.output-root }}
        CONFIG_FILE: ${{ steps.paths.outputs.config-file }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
        REPOSITORY_REF: ${{ inputs.repository-ref }}
      run: |
        set -euo pipefail
        dotnet "$ACTION_ROOT/src/GenerateDocuments/bin/Release/net8.0/AtspmDocsGenerator.dll" \
          --workspace-root "${{ steps.paths.outputs.workspace-root }}" \
          --source-root "$SOURCE_ROOT" \
          --output-root "$OUTPUT_ROOT" \
          --map "$CONFIG_FILE" \
          --repository-url "$REPOSITORY_URL" \
          --repository-ref "$REPOSITORY_REF" \
          --generated-at "${{ steps.paths.outputs.generated-at }}"

    - name: Install MkDocs dependencies
      if: inputs.validate-site == 'true'
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: python -m pip install --requirement "$ACTION_ROOT/requirements.txt"

    - name: Validate generated site
      if: inputs.validate-site == 'true'
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        DOCS_DIR: ${{ steps.paths.outputs.output-root }}
        DOCS_CONFIG: ${{ steps.paths.outputs.config-file }}
        DOCS_REPOSITORY_URL: ${{ inputs.repository-url }}
      run: |
        set -euo pipefail
        python -m mkdocs build \
          --strict \
          --config-file "$ACTION_ROOT/mkdocs.yml" \
          --site-dir "$RUNNER_TEMP/atspm-documentation-site"
