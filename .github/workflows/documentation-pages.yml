name: Shared documentation Pages preview and publication

on:
  workflow_call:
    inputs:
      docs-branch:
        description: Branch containing reviewed, committed generated documentation.
        required: true
        type: string
      config-file:
        type: string
        default: documentation.json
      output-directory:
        type: string
        default: docs/autogenerated
      publish:
        description: Deploy to GitHub Pages only after separate rollout approval.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shared-docs-pages-${{ github.repository }}-${{ inputs.docs-branch }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate branch
        env:
          DOCS_BRANCH: ${{ inputs.docs-branch }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DOCS_BRANCH"
          [[ "$EVENT_REF" == "refs/heads/$DOCS_BRANCH" ]] || { echo 'Run from the configured documentation branch.'; exit 1; }

      - name: Check out reviewed consumer commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: _source
          persist-credentials: false

      - name: Check out the exact generator workflow revision
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _generator
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: _generator/requirements.txt

      - name: Validate committed documentation
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          DOCS_REVISION: ${{ github.sha }}
          GENERATOR_REF: ${{ job.workflow_sha }}
        run: |
          python _generator/scripts/validate_publication.py \
            --repository _source --config "$CONFIG_FILE" --output "$OUTPUT_DIRECTORY" \
            --repository-url "$REPOSITORY_URL" --docs-revision "$DOCS_REVISION" \
            --generator-ref "$GENERATOR_REF" --review-file "$RUNNER_TEMP/documentation-review.txt"

      - name: Install site tooling
        run: python -m pip install --requirement _generator/requirements.txt

      - name: Build committed documentation site
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
          DOCS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          export DOCS_CONFIG="$GITHUB_WORKSPACE/_source/$CONFIG_FILE"
          export DOCS_DIR="$GITHUB_WORKSPACE/_source/$OUTPUT_DIRECTORY"
          python -m mkdocs build --strict --config-file _generator/mkdocs.yml \
            --site-dir "$RUNNER_TEMP/documentation-site"

      - name: Upload reviewable site preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pages-preview
          path: |
            ${{ runner.temp }}/documentation-site
            ${{ runner.temp }}/documentation-review.txt
          if-no-files-found: error
          retention-days: 14

      - name: Package Pages artifact only when publication is enabled
        if: inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/documentation-site

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages configuration
        uses: actions/configure-pages@v6

      - name: Deploy reviewed site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
