name: Update generated documentation

on:
  workflow_dispatch:
  push:
    branches: [documentation-integration]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Test this pushed branch now; replace with a reviewed full commit SHA to pin the version.
    uses: avenueconsultants/avenue-atspm-documentation-generator/.github/workflows/documentation-pr.yml@feature/generic-documentation-test
    with:
      source-branch: documentation-integration
      target-branch: documentation-integration
      create-pr: true
      # Explicit pages make a new section fail coverage until its role is known.
